<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin-top: 0; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }

    .auth-box {
      margin: 28px 0;
      padding: 22px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #1a2a3d;
    }
    .auth-box p { font-size: 15px; }
    .field { display: grid; gap: 8px; margin: 16px 0; }
    .field label { color: #bfd0e5; font-size: 14px; }
    .field input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #71869c;
      border-radius: 8px;
      background: #101a28;
      color: #ecf4ff;
      font: inherit;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #287c91;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    [hidden] { display: none !important; }
    #auth-message { min-height: 24px; margin-bottom: 0; }
    #auth-message[data-kind="error"] { color: #ff9eac; }
    #auth-message[data-kind="success"] { color: #8fe2b1; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 11단계 접속 앱</div>
    <h1>점령된 자료실</h1>
    <p>서버 승인 전에는 보호 자료를 표시하지 않으며, 승인된 기기에서만 기존 자료실이 열립니다.</p>

    <!-- 1. 기기 승인 대기 / 로그인 영역 -->
    <section id="auth-section" class="auth-box">
      <h2>기기 승인 및 인증</h2>
      <p>로그인 후 서버의 기기 승인 결과를 기다립니다.</p>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="user@example.com">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button id="login-btn" type="button">로그인 및 승인 요청</button>
      <p id="auth-message"></p>
    </section>

    <!-- 2. 승인 전 대기 안내 (기본 표시) -->
    <section id="pending-section" class="notice">
      <h2>승인 대기 중</h2>
      <p>아직 기기가 승인되지 않았습니다. 설치 표시나 버튼 조작이 아닌 서버의 공식 승인 응답 후에만 자료실이 열립니다.</p>
    </section>

    <!-- 3. 서버 승인 후 열리는 기존 자료실 화면 (승인 전에는 hidden) -->
    <section id="secure-vault-section" hidden>
      <div class="notice" style="border-color: #8fe2b1; background: #2a613d44; color: #e3ffe8;">
        <h2>기기 승인 완료</h2>
        <p>서버 확인을 거쳐 보안 자료실이 안전하게 열렸습니다.</p>
      </div>
      <h2>자료 목록</h2>
      <ul id="memo-list">
        <li>
          <strong>내 메모</strong>
          <span>서버 승인 후 안전하게 조회된 항목입니다.</span>
        </li>
      </ul>
    </section>
  </main>

  <!-- Supabase CDN (예시) -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // Supabase 클라이언트 생성 시 세션 저장 비활성화 필수
    const SUPABASE_URL = 'https://dimfuboksglkwfrotuoa.supabase.co'; // 설정값에 맞게 조정
    const SUPABASE_ANON_KEY = 'your-anon-key'; // 환경에 맞는 키 사용

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: false
      }
    });

    const loginBtn = document.getElementById('login-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authMessage = document.getElementById('auth-message');
    const pendingSection = document.getElementById('pending-section');
    const secureVaultSection = document.getElementById('secure-vault-section');

    loginBtn.addEventListener('click', async () => {
      authMessage.textContent = '로그인 중...';
      authMessage.setAttribute('data-kind', '');

      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value,
      });

      if (error) {
        authMessage.textContent = error.message;
        authMessage.setAttribute('data-kind', 'error');
        return;
      }

      authMessage.textContent = '로그인 성공. 서버 승인 확인 중...';
      authMessage.setAttribute('data-kind', 'success');

      // [중요] 로그인 직후 loadMemos() 등을 절대 부르지 않고 서버 승인 대기
      // 서버에서 기기 승인 여부를 검증했다고 가정 (예: API 요청 등)
      // 여기서는 서버 승인 응답이 공식적으로 승인(approved === true)일 때만 화면 전환
      const isServerApproved = await checkServerApproval(data.session);

      if (isServerApproved) {
        // 승인된 기기에서만 기존 화면 오픈
        pendingSection.hidden = true;
        secureVaultSection.hidden = false;
        loadSecureMemos(); // 승인 후에만 데이터 로드
      } else {
        authMessage.textContent = '서버 기기 승인이 거부되었거나 대기 중입니다.';
        authMessage.setAttribute('data-kind', 'error');
      }
    });

    async function checkServerApproval(session) {
      // 서버의 기기 승인 확인 엔드포인트 호출 예시 (또는 서버 응답 검증)
      // 단순 버튼 클릭이나 설치 여부가 아닌 서버 응답 값을 신뢰
      try {
        const res = await fetch('/api/check-approval', {
          headers: {
            'Authorization': `Bearer ${session.access_token}`
          }
        });
        const result = await res.json();
        return result.approved === true;
      } catch {
        return false;
      }
    }

    function loadSecureMemos() {
      // 승인 후 기존 자료실 데이터 로딩 로직 수행
    }
  </script>
</body>
</html>
